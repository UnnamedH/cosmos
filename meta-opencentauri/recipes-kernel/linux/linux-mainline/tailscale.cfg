# Applied only when DISTRO_FEATURES contains "tailscale".
# fragment.cfg turns these off for the default image. This fragment is
# merged after it. do_configure:append in the bbappend sets the same
# symbols again so a later oldconfig cannot drop them.

# TUN is the kernel datapath. Userspace networking is only a fallback
# and does not put the printer's services on the tailscale address.
CONFIG_TUN=y

# Tailscale assigns an IPv6 ULA as well as a 100.64/10 address. Without
# IPv6, peers may try the AAAA first and time out before using IPv4.
CONFIG_IPV6=y

# tailscaled installs policy routing rules (table 52) via netlink.
CONFIG_IP_ADVANCED_ROUTER=y
CONFIG_IP_MULTIPLE_TABLES=y

# CONFIG_NETFILTER stays off. The conntrack hash is about 1 MB, and
# basic node-to-node access does not need it. Subnet routing and exit
# nodes are not supported on this image.
